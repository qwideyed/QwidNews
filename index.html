<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QwidNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background-color:#0d0f12;color:#d1d5db;font-family:'Inter',sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
.ticker-bar{background:#11141a;border-bottom:1px solid #1f2530;display:flex;align-items:center;height:38px;overflow:hidden;font-size:13px}
.ticker-badge{background:#e63946;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;padding:0 14px;height:100%;display:flex;align-items:center;white-space:nowrap;z-index:2}
.ticker-content{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.ticker-track{display:flex;white-space:nowrap;will-change:transform;animation:marquee 14s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{padding:0 22px;color:#9ca3af;display:inline-flex;align-items:center;gap:8px}
.ticker-item:hover{color:#fff}
.ticker-item span{color:#e63946;font-size:11px;font-weight:700}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.header{background:#14171c;border-bottom:1px solid #1f2530;position:sticky;top:0;z-index:50}
.header-row{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px}
.brand-square{width:36px;height:36px;background:#e63946;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.brand-name{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:24px;letter-spacing:1px;color:#fff}
.brand-name span{color:#e63946}
.search-wrapper{flex:1;max-width:440px;margin:0 24px;position:relative}
.search-wrapper input{width:100%;background:#1b1f26;border:1px solid #28303d;color:#fff;padding:8px 14px 8px 38px;border-radius:4px;font-size:13px;outline:none}
.search-wrapper input:focus{border-color:#e63946}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:18px;color:#6b7280}
.header-actions{display:flex;align-items:center;gap:12px;position:relative}
.post-action-btn{background:#e63946;color:#fff;padding:7px 16px;border-radius:4px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.5px;display:flex;align-items:center;gap:6px}
.post-action-btn:hover{background:#d62839}
.nav-menu-btn{width:38px;height:38px;border:1px solid #28303d;border-radius:4px;background:#1b1f26;color:#fff;display:flex;align-items:center;justify-content:center}
.dropdown-menu{position:absolute;right:0;top:48px;background:#181c23;border:1px solid #2a3342;border-radius:6px;width:190px;display:none;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,0.6);z-index:60;overflow:hidden}
.dropdown-menu.active{display:flex}
.dropdown-item{padding:12px 16px;font-size:13px;color:#9ca3af;border-bottom:1px solid #202734;display:flex;align-items:center;gap:10px}
.dropdown-item:hover{background:#202734;color:#fff}
.dropdown-item:last-child{border-bottom:none}
.category-nav{background:#0f1217;border-bottom:1px solid #1a1f27}
.category-list{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
.category-pill{padding:6px 14px;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;color:#6b7280;border-radius:3px}
.category-pill.active,.category-pill:hover{background:#1a1f27;color:#fff}
.category-pill.active{color:#e63946}
.spotlight-zone{padding:24px 0 20px;border-bottom:1px solid #1a1f27}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:block;width:3px;height:14px;background:#e63946}
.spotlight-grid{display:grid;grid-template-columns:1.8fr 1.2fr;gap:20px}
.lead-story{position:relative;background:#14171c;border:1px solid #202631;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:390px}
.lead-media{position:relative;flex:1;background:#090b0e;overflow:hidden}
.lead-img{width:100%;height:100%;object-fit:cover;min-height:240px}
.lead-body{padding:18px;display:flex;flex-direction:column;gap:8px}
.lead-headline{font-family:'Newsreader',serif;font-size:24px;color:#fff;font-weight:700;line-height:1.25}
.lead-headline:hover{color:#e63946}
.lead-desc{font-size:13px;color:#9ca3af;line-height:1.5}
.lead-info{display:flex;align-items:center;gap:12px;font-size:11px;color:#6b7280;margin-top:4px}
.tag-badge{background:#e63946;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;font-family:'Chakra Petch',sans-serif;letter-spacing:0.5px;display:inline-block}
.tag-alt{background:#222834;color:#9ca3af}
.tag-spotlight{background:#d97706;color:#fff}
.side-stories{display:flex;flex-direction:column;gap:10px}
.mini-story-card{display:flex;gap:12px;background:#14171c;border:1px solid #202631;border-radius:6px;padding:10px;align-items:center}
.mini-story-card:hover{border-color:#2e3747}
.mini-thumb-img{width:90px;height:68px;border-radius:4px;object-fit:cover;background:#090b0e;flex-shrink:0}
.mini-details{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mini-story-title{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;color:#fff;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-story-title:hover{color:#e63946}
.mini-story-meta{font-size:11px;color:#6b7280;display:flex;gap:8px;align-items:center}
.feed-zone{padding:28px 0 60px}
.feed-stack{display:flex;flex-direction:column;gap:14px}
.feed-card{display:grid;grid-template-columns:200px 1fr;gap:16px;background:#14171c;border:1px solid #202631;border-radius:6px;overflow:hidden;padding:12px}
.feed-card:hover{border-color:#2a3342}
.feed-thumb{width:100%;height:130px;object-fit:cover;border-radius:4px;background:#090b0e}
.feed-details{display:flex;flex-direction:column;justify-content:space-between}
.feed-headline{font-family:'Newsreader',serif;font-size:19px;font-weight:700;color:#fff;line-height:1.3}
.feed-headline:hover{color:#e63946}
.feed-excerpt{font-size:13px;color:#9ca3af;margin:5px 0;line-height:1.5}
.feed-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:#6b7280}
.empty-placeholder{background:#14171c;border:1px dashed #242c3a;border-radius:6px;padding:60px 20px;text-align:center}
.empty-placeholder .material-symbols-outlined{font-size:42px;color:#4b5563;margin-bottom:12px}
.empty-headline{font-family:'Chakra Petch',sans-serif;font-size:18px;color:#fff;margin-bottom:6px}
.empty-sub{font-size:13px;color:#6b7280;max-width:440px;margin:0 auto 16px}
@media(max-width:960px){
.spotlight-grid{grid-template-columns:1fr}
.search-wrapper{display:none}
}
@media(max-width:640px){
.feed-card{grid-template-columns:1fr}
.feed-thumb{height:180px}
}
</style>
</head>
<body>

<div class="ticker-bar">
  <div class="ticker-badge">BREAKING WIRE</div>
  <div class="ticker-content">
    <div class="ticker-track" id="tickerTrack">
      <div class="ticker-item">No active breaking dispatches on the wire.</div>
    </div>
  </div>
</div>

<header class="header">
  <div class="container header-row">
    <a href="index.html" class="brand">
      <div class="brand-square">Q</div>
      <div class="brand-name">QWID<span>NEWS</span></div>
    </a>

    <div class="search-wrapper">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" id="searchInput" placeholder="Search news stories..." oninput="handleSearch()">
    </div>

    <div class="header-actions">
      <a href="post.html" class="post-action-btn">
        <span class="material-symbols-outlined" style="font-size:18px">add_circle</span>
        Post News
      </a>
      <button class="nav-menu-btn" onclick="toggleDropdown(event)">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="dropdown-menu" id="navDropdown">
        <a href="post.html" class="dropdown-item"><span class="material-symbols-outlined">edit_square</span>Post News</a>
        <a href="wiki.html" class="dropdown-item"><span class="material-symbols-outlined">auto_stories</span>Wiki</a>
        <a href="account.html" class="dropdown-item"><span class="material-symbols-outlined">person</span>Account</a>
        <a href="setting.html" class="dropdown-item"><span class="material-symbols-outlined">settings</span>Settings</a>
      </div>
    </div>
  </div>
</header>

<nav class="category-nav">
  <div class="container">
    <div class="category-list" id="categoryTabs">
      <button class="category-pill active" onclick="filterCategory('ALL')">ALL WIRE</button>
      <button class="category-pill" onclick="filterCategory('GAMING')">GAMING</button>
      <button class="category-pill" onclick="filterCategory('ANIME')">ANIME</button>
      <button class="category-pill" onclick="filterCategory('MOVIES')">MOVIES</button>
      <button class="category-pill" onclick="filterCategory('TV SHOWS')">TV SHOWS</button>
      <button class="category-pill" onclick="filterCategory('REVIEWS')">REVIEWS</button>
    </div>
  </div>
</nav>

<section class="spotlight-zone" id="spotlightArea" style="display:none">
  <div class="container">
    <div class="section-header">
      <div class="section-title">Top 5 Spotlight</div>
    </div>
    <div class="spotlight-grid">
      <div id="leadSpotlightContainer"></div>
      <div class="side-stories" id="sideSpotlightContainer"></div>
    </div>
  </div>
</section>

<section class="feed-zone">
  <div class="container">
    <div class="section-header">
      <div class="section-title">Latest Dispatches</div>
      <span id="storyCountText" style="font-size:12px;color:#6b7280;font-family:'Chakra Petch',sans-serif">0 STORIES</span>
    </div>

    <div class="feed-stack" id="postsFeedContainer"></div>
  </div>
</section>

<script>
let activeCategory = 'ALL';
let currentSearch = '';

function fetchPosts() {
  try {
    return JSON.parse(localStorage.getItem('qwidnews_posts')) || [];
  } catch(e) {
    return [];
  }
}

function toggleDropdown(e) {
  e.stopPropagation();
  const dropdown = document.getElementById('navDropdown');
  dropdown.classList.toggle('active');
}

document.addEventListener('click', () => {
  const dropdown = document.getElementById('navDropdown');
  if (dropdown) dropdown.classList.remove('active');
});

function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.category-pill').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() === cat || (cat === 'ALL' && btn.textContent.trim() === 'ALL WIRE'));
  });
  renderSite();
}

function handleSearch() {
  currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
  renderSite();
}

function buildTicker(posts) {
  const track = document.getElementById('tickerTrack');
  const breaking = posts.filter(p => p.isBreaking);

  if (breaking.length === 0) {
    track.innerHTML = '<div class="ticker-item">No active breaking dispatches on the wire.</div>';
    return;
  }

  const items = breaking.map(p => `
    <a href="entry.html?id=${p.id}" class="ticker-item">
      <span>● [${escapeHtml(p.category || 'WIRE')}]</span>
      ${escapeHtml(p.title)}
    </a>
  `).join('');

  track.innerHTML = items + items;
}

function buildSpotlight(posts) {
  const section = document.getElementById('spotlightArea');
  const leadEl = document.getElementById('leadSpotlightContainer');
  const sideEl = document.getElementById('sideSpotlightContainer');

  const top5 = posts
    .slice()
    .sort((a, b) => {
      if (b.isTop10Sponsored !== a.isTop10Sponsored) return (b.isTop10Sponsored ? 1 : 0) - (a.isTop10Sponsored ? 1 : 0);
      if (b.isBreaking !== a.isBreaking) return (b.isBreaking ? 1 : 0) - (a.isBreaking ? 1 : 0);
      return (b.views || 0) - (a.views || 0);
    })
    .slice(0, 5);

  if (top5.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';

  const lead = top5[0];
  leadEl.innerHTML = `
    <article class="lead-story">
      <a href="entry.html?id=${lead.id}" class="lead-media">
        <img class="lead-img" src="${escapeHtml(lead.image || '')}" alt="${escapeHtml(lead.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200&q=80'">
      </a>
      <div class="lead-body">
        <div>
          ${lead.isTop10Sponsored ? '<span class="tag-badge tag-spotlight">SPOTLIGHT</span> ' : ''}
          <span class="tag-badge">${escapeHtml(lead.category || 'NEWS')}</span>
        </div>
        <a href="entry.html?id=${lead.id}">
          <h2 class="lead-headline">${escapeHtml(lead.title)}</h2>
        </a>
        <p class="lead-desc">${escapeHtml(lead.excerpt || '')}</p>
        <div class="lead-info">
          <span>By ${escapeHtml(lead.author || 'Staff')}</span>
          <span>•</span>
          <span>${formatDate(lead.date)}</span>
        </div>
      </div>
    </article>
  `;

  const remaining = top5.slice(1);
  if (remaining.length === 0) {
    sideEl.innerHTML = '';
  } else {
    sideEl.innerHTML = remaining.map(p => `
      <a href="entry.html?id=${p.id}" class="mini-story-card">
        <img class="mini-thumb-img" src="${escapeHtml(p.image || '')}" alt="${escapeHtml(p.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&q=80'">
        <div class="mini-details">
          <div>
            ${p.isTop10Sponsored ? '<span class="tag-badge tag-spotlight" style="font-size:9px">SPOTLIGHT</span> ' : ''}
            <span class="tag-badge tag-alt" style="font-size:9px">${escapeHtml(p.category || 'NEWS')}</span>
          </div>
          <div class="mini-story-title">${escapeHtml(p.title)}</div>
          <div class="mini-story-meta">
            <span>By ${escapeHtml(p.author || 'Staff')}</span>
            <span>•</span>
            <span>${formatDate(p.date)}</span>
          </div>
        </div>
      </a>
    `).join('');
  }
}

function buildFeed(posts) {
  const container = document.getElementById('postsFeedContainer');
  const countLabel = document.getElementById('storyCountText');

  let filtered = posts.slice();

  if (activeCategory !== 'ALL') {
    filtered = filtered.filter(p => (p.category || '').toUpperCase() === activeCategory);
  }

  if (currentSearch) {
    filtered = filtered.filter(p => 
      (p.title || '').toLowerCase().includes(currentSearch) ||
      (p.excerpt || '').toLowerCase().includes(currentSearch) ||
      (p.author || '').toLowerCase().includes(currentSearch)
    );
  }

  countLabel.textContent = `${filtered.length} STORIES`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-placeholder">
        <div class="material-symbols-outlined">newspaper</div>
        <div class="empty-headline">No Stories Available</div>
        <p class="empty-sub">There are currently no dispatches published in this category. Submit your report to see it appear on the wire.</p>
        <a href="post.html" class="post-action-btn" style="display:inline-flex">Submit a Story</a>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(p => `
    <article class="feed-card">
      <a href="entry.html?id=${p.id}">
        <img class="feed-thumb" src="${escapeHtml(p.image || '')}" alt="${escapeHtml(p.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80'">
      </a>
      <div class="feed-details">
        <div>
          <div style="margin-bottom:6px">
            ${p.isTop10Sponsored ? '<span class="tag-badge tag-spotlight">SPOTLIGHT</span> ' : ''}
            ${p.isBreaking ? '<span class="tag-badge">BREAKING</span> ' : ''}
            <span class="tag-badge tag-alt">${escapeHtml(p.category || 'NEWS')}</span>
          </div>
          <a href="entry.html?id=${p.id}">
            <h3 class="feed-headline">${escapeHtml(p.title)}</h3>
          </a>
          <p class="feed-excerpt">${escapeHtml(p.excerpt || '')}</p>
        </div>
        <div class="feed-meta">
          <span>By ${escapeHtml(p.author || 'Wire Reporter')}</span>
          <span>•</span>
          <span>${formatDate(p.date)}</span>
          <span>•</span>
          <span>${p.views || 0} views</span>
        </div>
      </div>
    </article>
  `).join('');
}

function renderSite() {
  const posts = fetchPosts();
  buildTicker(posts);
  buildSpotlight(posts);
  buildFeed(posts);
}

function formatDate(dateStr) {
  if (!dateStr) return 'Just now';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[tag] || tag));
}

document.addEventListener('DOMContentLoaded', renderSite);
</script>

</body>
</html>
