<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QwidNews — Gaming & Anime Wire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background-color:#0a0c0f;color:#d1d5db;font-family:'Inter',sans-serif;line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
.container{max-width:1440px;margin:0 auto;padding:0 24px}
.ticker-bar{background:#0d1015;border-bottom:1px solid #1f242c;display:flex;align-items:center;height:40px;overflow:hidden;font-size:13px}
.ticker-tag{background:#e63946;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:11px;letter-spacing:1px;padding:0 14px;height:100%;display:flex;align-items:center;white-space:nowrap;z-index:2}
.ticker-wrap{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
.ticker-track{display:flex;white-space:nowrap;will-change:transform;animation:marquee 14s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{padding:0 24px;color:#9ca3af;display:inline-flex;align-items:center;gap:8px}
.ticker-item:hover{color:#fff}
.ticker-item span{color:#e63946;font-size:10px;font-weight:700}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.header{border-bottom:1px solid #1a1f26;background:#0d1015;position:sticky;top:0;z-index:40}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:36px;height:36px;background:#e63946;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:20px;border-radius:4px}
.brand-text{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:24px;letter-spacing:1px;color:#fff}
.brand-text span{color:#e63946}
.search-box{flex:1;max-width:400px;margin:0 32px;position:relative}
.search-box input{width:100%;background:#14171d;border:1px solid #222731;color:#fff;padding:8px 14px 8px 38px;border-radius:4px;font-size:13px;outline:none}
.search-box input:focus{border-color:#e63946}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:18px;color:#6b7280}
.nav-actions{display:flex;align-items:center;gap:12px;position:relative}
.post-btn{background:#e63946;color:#fff;padding:8px 16px;border-radius:4px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;letter-spacing:0.5px;display:flex;align-items:center;gap:6px}
.post-btn:hover{background:#d62839}
.menu-btn{width:38px;height:38px;border:1px solid #222731;border-radius:4px;background:#14171d;color:#fff;display:flex;align-items:center;justify-content:center}
.menu-dropdown{position:absolute;right:0;top:48px;background:#14171d;border:1px solid #242a36;border-radius:6px;width:180px;display:none;flex-direction:column;box-shadow:0 10px 25px rgba(0,0,0,0.5);overflow:hidden;z-index:50}
.menu-dropdown.active{display:flex}
.menu-link{padding:12px 16px;font-size:13px;color:#9ca3af;border-bottom:1px solid #1b1f27;display:flex;align-items:center;gap:10px}
.menu-link:hover{background:#1a1f26;color:#fff}
.menu-link:last-child{border-bottom:none}
.sub-nav{background:#0a0c0f;border-bottom:1px solid #14171d}
.cat-list{display:flex;gap:4px;overflow-x:auto;padding:8px 0}
.cat-btn{padding:6px 14px;font-family:'Chakra Petch',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;color:#6b7280;border-radius:3px}
.cat-btn.active,.cat-btn:hover{background:#161a21;color:#fff}
.cat-btn.active{color:#e63946}
.spotlight-section{padding:28px 0 20px;border-bottom:1px solid #1a1f26}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-title{font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-title::before{content:'';display:block;width:3px;height:14px;background:#e63946}
.spotlight-grid{display:grid;grid-template-columns:1.8fr 1.2fr;gap:20px}
.lead-card{position:relative;background:#101318;border:1px solid #1e242d;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:420px}
.lead-img-box{position:relative;flex:1;background:#060709;overflow:hidden}
.lead-img{width:100%;height:100%;object-fit:cover;min-height:260px}
.lead-content{padding:20px;display:flex;flex-direction:column;gap:8px}
.lead-title{font-family:'Newsreader',serif;font-size:26px;color:#fff;font-weight:700;line-height:1.25}
.lead-title:hover{color:#e63946}
.lead-excerpt{font-size:13px;color:#9ca3af;line-height:1.5}
.lead-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:#6b7280;margin-top:4px}
.badge{background:#e63946;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;font-family:'Chakra Petch',sans-serif;letter-spacing:0.5px;display:inline-block}
.badge-alt{background:#222731;color:#9ca3af}
.badge-gold{background:#d97706;color:#fff}
.side-stack{display:flex;flex-direction:column;gap:12px}
.mini-card{display:flex;gap:14px;background:#101318;border:1px solid #1e242d;border-radius:6px;padding:12px;align-items:center}
.mini-card:hover{border-color:#2e3644}
.mini-thumb{width:100px;height:72px;border-radius:4px;object-fit:cover;background:#060709;flex-shrink:0}
.mini-info{display:flex;flex-direction:column;gap:4px;overflow:hidden}
.mini-title{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:#fff;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-title:hover{color:#e63946}
.mini-meta{font-size:11px;color:#6b7280;display:flex;gap:8px;align-items:center}
.wire-section{padding:32px 0 60px}
.feed-grid{display:grid;grid-template-columns:1fr;gap:24px}
.news-list{display:flex;flex-direction:column;gap:16px}
.wire-card{display:grid;grid-template-columns:220px 1fr;gap:18px;background:#101318;border:1px solid #1b2028;border-radius:6px;overflow:hidden;padding:14px}
.wire-card:hover{border-color:#2a3240}
.wire-thumb{width:100%;height:140px;object-fit:cover;border-radius:4px;background:#07080a}
.wire-body{display:flex;flex-direction:column;justify-content:space-between}
.wire-headline{font-family:'Newsreader',serif;font-size:20px;font-weight:700;color:#fff;line-height:1.3}
.wire-headline:hover{color:#e63946}
.wire-excerpt{font-size:13px;color:#9ca3af;margin:6px 0;line-height:1.5}
.wire-meta{display:flex;align-items:center;gap:12px;font-size:11px;color:#6b7280}
.empty-box{background:#101318;border:1px dashed #242a35;border-radius:6px;padding:60px 20px;text-align:center}
.empty-icon{font-size:44px;color:#4b5563;margin-bottom:12px}
.empty-title{font-family:'Chakra Petch',sans-serif;font-size:18px;color:#fff;margin-bottom:6px}
.empty-desc{font-size:13px;color:#6b7280;max-width:440px;margin:0 auto 16px}
@media(max-width:960px){
.spotlight-grid{grid-template-columns:1fr}
.search-box{display:none}
}
@media(max-width:640px){
.wire-card{grid-template-columns:1fr}
.wire-thumb{height:180px}
}
</style>
</head>
<body>

<div class="ticker-bar">
  <div class="ticker-tag">BREAKING WIRE</div>
  <div class="ticker-wrap">
    <div class="ticker-track" id="tickerTrack">
      <div class="ticker-item">No wire alerts posted yet.</div>
    </div>
  </div>
</div>

<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="brand">
      <div class="brand-mark">Q</div>
      <div class="brand-text">QWID<span>NEWS</span></div>
    </a>

    <div class="search-box">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" id="searchInput" placeholder="Search news stories..." oninput="handleSearch()">
    </div>

    <div class="nav-actions">
      <a href="post.html" class="post-btn">
        <span class="material-symbols-outlined" style="font-size:18px">add_circle</span>
        Post News
      </a>
      <button class="menu-btn" onclick="toggleMenu(event)">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="post.html" class="menu-link"><span class="material-symbols-outlined">edit_square</span>Post News</a>
        <a href="wiki.html" class="menu-link"><span class="material-symbols-outlined">auto_stories</span>Wiki</a>
        <a href="account.html" class="menu-link"><span class="material-symbols-outlined">person</span>Account</a>
        <a href="setting.html" class="menu-link"><span class="material-symbols-outlined">settings</span>Settings</a>
      </div>
    </div>
  </div>
</header>

<nav class="sub-nav">
  <div class="container">
    <div class="cat-list" id="categoryFilter">
      <button class="cat-btn active" onclick="setCategory('ALL')">ALL WIRE</button>
      <button class="cat-btn" onclick="setCategory('GAMING')">GAMING</button>
      <button class="cat-btn" onclick="setCategory('ANIME')">ANIME</button>
      <button class="cat-btn" onclick="setCategory('MOVIES')">MOVIES</button>
      <button class="cat-btn" onclick="setCategory('TV SHOWS')">TV SHOWS</button>
      <button class="cat-btn" onclick="setCategory('REVIEWS')">REVIEWS</button>
    </div>
  </div>
</nav>

<section class="spotlight-section" id="spotlightSection" style="display:none">
  <div class="container">
    <div class="sec-head">
      <div class="sec-title">Top 5 Spotlight</div>
    </div>
    <div class="spotlight-grid">
      <div id="leadSpotlight"></div>
      <div class="side-stack" id="sideSpotlight"></div>
    </div>
  </div>
</section>

<section class="wire-section">
  <div class="container">
    <div class="sec-head">
      <div class="sec-title" id="feedHeading">Latest Dispatches</div>
      <span id="storyCount" style="font-size:12px;color:#6b7280;font-family:'Chakra Petch',sans-serif">0 STORIES</span>
    </div>

    <div class="feed-grid">
      <div class="news-list" id="postsContainer"></div>
    </div>
  </div>
</section>

<script>
let currentCategory = 'ALL';
let searchQuery = '';

function getPosts() {
  try {
    return JSON.parse(localStorage.getItem('qwidnews_posts')) || [];
  } catch(e) {
    return [];
  }
}

function toggleMenu(e) {
  e.stopPropagation();
  const menu = document.getElementById('menuDropdown');
  menu.classList.toggle('active');
}

document.addEventListener('click', () => {
  const menu = document.getElementById('menuDropdown');
  if (menu) menu.classList.remove('active');
});

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() === cat || (cat === 'ALL' && btn.textContent.trim() === 'ALL WIRE'));
  });
  renderAll();
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  renderAll();
}

function renderTicker(posts) {
  const tickerTrack = document.getElementById('tickerTrack');
  const breaking = posts.filter(p => p.isBreaking);

  if (breaking.length === 0) {
    tickerTrack.innerHTML = '<div class="ticker-item">No active wire alerts.</div>';
    return;
  }

  const itemsHtml = breaking.map(p => `
    <a href="entry.html?id=${p.id}" class="ticker-item">
      <span>● [${escapeHtml(p.category || 'WIRE')}]</span>
      ${escapeHtml(p.title)}
    </a>
  `).join('');

  tickerTrack.innerHTML = itemsHtml + itemsHtml;
}

function renderSpotlight(posts) {
  const spotlightSection = document.getElementById('spotlightSection');
  const leadContainer = document.getElementById('leadSpotlight');
  const sideContainer = document.getElementById('sideSpotlight');

  const spotlightPosts = posts
    .slice()
    .sort((a, b) => {
      if (b.isTop10Sponsored !== a.isTop10Sponsored) return (b.isTop10Sponsored ? 1 : 0) - (a.isTop10Sponsored ? 1 : 0);
      if (b.isBreaking !== a.isBreaking) return (b.isBreaking ? 1 : 0) - (a.isBreaking ? 1 : 0);
      return (b.views || 0) - (a.views || 0);
    })
    .slice(0, 5);

  if (spotlightPosts.length === 0) {
    spotlightSection.style.display = 'none';
    return;
  }

  spotlightSection.style.display = 'block';

  const lead = spotlightPosts[0];
  leadContainer.innerHTML = `
    <article class="lead-card">
      <a href="entry.html?id=${lead.id}" class="lead-img-box">
        <img class="lead-img" src="${escapeHtml(lead.image || '')}" alt="${escapeHtml(lead.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200&q=80'">
      </a>
      <div class="lead-content">
        <div>
          ${lead.isTop10Sponsored ? '<span class="badge badge-gold">SPOTLIGHT</span> ' : ''}
          <span class="badge">${escapeHtml(lead.category || 'NEWS')}</span>
        </div>
        <a href="entry.html?id=${lead.id}">
          <h2 class="lead-title">${escapeHtml(lead.title)}</h2>
        </a>
        <p class="lead-excerpt">${escapeHtml(lead.excerpt || '')}</p>
        <div class="lead-meta">
          <span>By ${escapeHtml(lead.author || 'Wire Desk')}</span>
          <span>•</span>
          <span>${formatDate(lead.date)}</span>
        </div>
      </div>
    </article>
  `;

  const side = spotlightPosts.slice(1);
  if (side.length === 0) {
    sideContainer.innerHTML = '';
  } else {
    sideContainer.innerHTML = side.map(p => `
      <a href="entry.html?id=${p.id}" class="mini-card">
        <img class="mini-thumb" src="${escapeHtml(p.image || '')}" alt="${escapeHtml(p.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&q=80'">
        <div class="mini-info">
          <div>
            ${p.isTop10Sponsored ? '<span class="badge badge-gold" style="font-size:9px">SPOTLIGHT</span> ' : ''}
            <span class="badge badge-alt" style="font-size:9px">${escapeHtml(p.category || 'NEWS')}</span>
          </div>
          <div class="mini-title">${escapeHtml(p.title)}</div>
          <div class="mini-meta">
            <span>By ${escapeHtml(p.author || 'Staff')}</span>
            <span>•</span>
            <span>${formatDate(p.date)}</span>
          </div>
        </div>
      </a>
    `).join('');
  }
}

function renderFeed(posts) {
  const container = document.getElementById('postsContainer');
  const countDisplay = document.getElementById('storyCount');

  let filtered = posts.slice();

  if (currentCategory !== 'ALL') {
    filtered = filtered.filter(p => (p.category || '').toUpperCase() === currentCategory);
  }

  if (searchQuery) {
    filtered = filtered.filter(p => 
      (p.title || '').toLowerCase().includes(searchQuery) ||
      (p.excerpt || '').toLowerCase().includes(searchQuery) ||
      (p.author || '').toLowerCase().includes(searchQuery)
    );
  }

  countDisplay.textContent = `${filtered.length} STORIES`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-box">
        <div class="empty-icon material-symbols-outlined">newspaper</div>
        <div class="empty-title">No News Dispatches Available</div>
        <p class="empty-desc">There are no published stories in this category yet. Be the first to publish a report to the wire.</p>
        <a href="post.html" class="post-btn" style="display:inline-flex">Submit a Story</a>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(p => `
    <article class="wire-card">
      <a href="entry.html?id=${p.id}">
        <img class="wire-thumb" src="${escapeHtml(p.image || '')}" alt="${escapeHtml(p.title)}" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80'">
      </a>
      <div class="wire-body">
        <div>
          <div style="margin-bottom:6px">
            ${p.isTop10Sponsored ? '<span class="badge badge-gold">SPOTLIGHT</span> ' : ''}
            ${p.isBreaking ? '<span class="badge">BREAKING</span> ' : ''}
            <span class="badge badge-alt">${escapeHtml(p.category || 'NEWS')}</span>
          </div>
          <a href="entry.html?id=${p.id}">
            <h3 class="wire-headline">${escapeHtml(p.title)}</h3>
          </a>
          <p class="wire-excerpt">${escapeHtml(p.excerpt || '')}</p>
        </div>
        <div class="wire-meta">
          <span>By ${escapeHtml(p.author || 'Wire Reporter')}</span>
          <span>•</span>
          <span>${formatDate(p.date)}</span>
          <span>•</span>
          <span>${p.views || 0} views</span>
        </div>
      </div>
    </article>
  `).join('');
}

function renderAll() {
  const posts = getPosts();
  renderTicker(posts);
  renderSpotlight(posts);
  renderFeed(posts);
}

function formatDate(dateStr) {
  if (!dateStr) return 'Just now';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#39;',
    '"': '&quot;'
  }[tag] || tag));
}

document.addEventListener('DOMContentLoaded', renderAll);
</script>

</body>
</html>
